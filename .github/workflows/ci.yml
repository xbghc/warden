name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      WARDEN_NATIVE: required
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check release versions
        run: pnpm check:release
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Test the portable Git backend
        run: pnpm test
        env:
          WARDEN_NATIVE: disabled
      - run: pnpm build:storybook

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Windows executes the complete suite serially to keep individual Git workflows responsive.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 40 || 30 }}
    env:
      WARDEN_NATIVE: required
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            node: 20
            target: linux-x64-gnu
          - os: ubuntu-22.04
            node: 22
            target: linux-x64-gnu
          - os: ubuntu-22.04
            node: 24
            target: linux-x64-gnu
          - os: ubuntu-22.04-arm
            node: 22
            target: linux-arm64-gnu
          - os: macos-latest
            node: 22
            target: darwin-arm64
          - os: macos-15-intel
            node: 22
            target: darwin-x64
          - os: windows-latest
            node: 22
            target: win32-x64-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - run: cargo test --workspace --locked
      - run: pnpm test --reporter=default --reporter=junit --outputFile.junit=test-results/vitest.xml
      - name: Upload tested native module
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: native/warden.${{ matrix.target }}.node
          if-no-files-found: error
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}-node-${{ matrix.node }}
          path: test-results/vitest.xml
          if-no-files-found: ignore

  vscode:
    name: Package and test VS Code extension
    needs: [quality, test]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      WARDEN_NATIVE: required
      WARDEN_NATIVE_EXPECT_ALL: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A universal VSIX contains only native modules tested by this same workflow run.
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: native
      - run: pnpm package:vscode
      - run: pnpm check:vscode
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: packages/vscode/warden-*.vsix
          if-no-files-found: error

  webview-ui:
    name: Packaged webview browser flows
    needs: vscode
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: vscode-extension
          path: packages/vscode
      - run: python -m pip install -r test/ui/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python test/ui/smoke.py
        env:
          WARDEN_UI_ARTIFACTS: test-results/webview
          WARDEN_NATIVE: disabled
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webview-screenshots
          path: test-results/webview
          if-no-files-found: ignore

  extension-host:
    name: VS Code (${{ matrix.os }}, ${{ matrix.vscode }})
    needs: vscode
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        vscode: ['1.95.3', stable]
    env:
      WARDEN_NATIVE: required
      WARDEN_VSCODE_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: vscode-extension
          path: packages/vscode
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: native
      - name: Test the packaged extension on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:vscode
      - name: Test the packaged extension on Windows and macOS
        if: runner.os != 'Linux'
        run: pnpm test:vscode
