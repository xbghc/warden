name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check release versions
        run: pnpm check:release
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm build:storybook

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Windows executes the complete suite serially to keep individual Git workflows responsive.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 40 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            node: 20
          - os: ubuntu-22.04
            node: 22
          - os: ubuntu-22.04
            node: 24
          - os: ubuntu-22.04-arm
            node: 22
          - os: macos-latest
            node: 22
          - os: macos-15-intel
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --reporter=default --reporter=junit --outputFile.junit=test-results/vitest.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}-node-${{ matrix.node }}
          path: test-results/vitest.xml
          if-no-files-found: ignore

  vscode:
    name: Package and test VS Code extension
    # UI checks can run alongside the engine matrix; publication still needs the entire workflow.
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:vscode
      - run: pnpm check:vscode
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: packages/vscode/warden-*.vsix
          if-no-files-found: error

  webview-ui:
    name: Packaged webview browser flows
    needs: vscode
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: vscode-extension
          path: packages/vscode
      - run: python -m pip install -r test/ui/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python test/ui/smoke.py
        env:
          WARDEN_UI_ARTIFACTS: test-results/webview
      - run: python test/ui/acp-smoke.py
        env:
          WARDEN_UI_ARTIFACTS: test-results/webview
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webview-screenshots
          path: test-results/webview
          if-no-files-found: ignore

  extension-host:
    name: VS Code (${{ matrix.os }}, ${{ matrix.vscode }})
    needs: vscode
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        vscode: ['1.106.0', stable]
    env:
      WARDEN_VSCODE_VERSION: ${{ matrix.vscode }}
      WARDEN_VSCODE_ARTIFACTS: test-results/extension-host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: vscode-extension
          path: packages/vscode
      - name: Test native tree replacement on Linux
        if: runner.os == 'Linux'
        env:
          WARDEN_VSCODE_SUITE: tree-refresh
        run: xvfb-run -a pnpm test:vscode
      - name: Test native tree replacement on Windows and macOS
        if: runner.os != 'Linux'
        env:
          WARDEN_VSCODE_SUITE: tree-refresh
        run: pnpm test:vscode
      - name: Test the packaged extension on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:vscode
      - name: Test the packaged extension on Windows and macOS
        if: runner.os != 'Linux'
        run: pnpm test:vscode
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: extension-host-${{ matrix.os }}-${{ matrix.vscode }}
          path: test-results/extension-host
          if-no-files-found: ignore
