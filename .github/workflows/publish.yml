name: Publish to npm

# Push a tag like v0.1.0 (matching package.json "version") to publish @xbghc/warden.
# Requires an npm automation token stored as the NPM_TOKEN repository secret.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
      # prepublishOnly runs `pnpm build && pnpm test` before anything is uploaded.
      - run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
