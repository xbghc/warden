name: Publish to npm

# Push a tag like v0.1.0 (matching package.json "version") to publish @xbghc/warden.
#
# Auth is npm trusted publishing (OIDC) — no NPM_TOKEN secret, no token to rotate.
# The registry hands out a short-lived credential only to this repo's publish.yml.
#
# This requires a Trusted Publisher configured on the package's npmjs.com settings
# page (user `xbghc`, repo `warden`, workflow `publish.yml`). That page only exists
# once the package does, so 0.1.0 was published from a laptop with `npm login`;
# npm cannot bootstrap a brand-new package over OIDC (npm/cli#8544).
#
# There is deliberately no `registry-url:` on setup-node. Older versions wrote
# `_authToken=${NODE_AUTH_TOKEN}` into .npmrc, which expands to empty with no token set and
# could convince npm auth was already configured so it never started the OIDC exchange
# (actions/setup-node#1551; fixed in v7 by dropping that dummy export). It is not needed
# either way — registry.npmjs.org is the default registry.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Lets the runner mint the OIDC token that the registry exchanges for a
  # short-lived publish credential. Trusted publishing does not work without it.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Node 22 bundles npm 10.x, but trusted publishing needs npm >= 11.5.1, and
      # `pnpm publish` shells out to the npm CLI — so this is what OIDC keys off.
      # An older npm silently falls back to token auth and then fails to authenticate.
      - run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
      # prepublishOnly runs `pnpm build && pnpm test` before anything is uploaded.
      # `--provenance` is explicit on purpose: npm generates an attestation on its own for a
      # trusted publish, but that did not happen through `pnpm publish` (0.2.0 shipped without
      # one). pnpm's own release workflow passes the flag for the same reason.
      - run: pnpm publish --access public --no-git-checks --provenance
