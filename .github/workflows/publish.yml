name: Publish VS Code

# Only a requested version tag publishes the exact VSIX tested by CI.
on:
  push:
    tags: ['v*']
  # Manual runs only verify Marketplace authentication; they never publish the extension.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  publish-vscode:
    name: Publish VS Code Marketplace
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    env:
      WARDEN_NATIVE_EXPECT_ALL: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:release
      - uses: actions/download-artifact@v8
        with:
          name: vscode-extension
          path: packages/vscode
      - run: pnpm check:vscode
      - name: Sign in to the Marketplace publishing identity
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # Entra trusts this GitHub environment; Marketplace grants the identity Contributor access.
      # Publish the tested VSIX unchanged without a PAT or Azure client secret.
      - name: Publish the tested VSIX with the Azure identity
        run: |
          VERSION="$(node -p "require('./packages/vscode/package.json').version")"
          pnpm exec vsce publish --packagePath "packages/vscode/warden-$VERSION.vsix" --azure-credential

  verify-marketplace-auth:
    name: Verify Marketplace authentication
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Show the identity to add to the Marketplace publisher
        run: |
          PROFILE_ID="$(az rest --url 'https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1' --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)"
          printf 'Marketplace identity: `%s`\n' "$PROFILE_ID" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify access to publisher xbghc
        run: pnpm exec vsce verify-pat xbghc --azure-credential
