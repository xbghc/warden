[package]
name = "warden-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
napi = { version = "3", features = ["async", "napi8"] }
napi-derive = "3"
tokio = { version = "1.48", features = ["rt-multi-thread"] }
warden-core = { path = "../warden-core" }

[build-dependencies]
napi-build = "2"
